name: Validate scheme-builder rebase (fork only)

on:
  push:
    branches:
      - validation/rebase-2229-runtime-scheme-20261008

permissions:
  contents: read

jobs:
  compile-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile API package tests
        run: |
          go test -run '^$' \
            ./api/v1/... \
            ./api/v1alpha1/... \
            ./api/v1beta1/... \
            ./cmd/extensions/oidc-policy/api/v1alpha1/... \
            ./cmd/extensions/plan-policy/api/v1alpha1/... \
            ./cmd/extensions/telemetry-policy/api/v1alpha1/...
